# Checks on every pull request. Nothing here deploys; the Terraform plan uses a
# read-only identity and the require-tags gate runs on it so problems show up
# in review, not at deploy time.
name: Pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Path-scoped, justified exceptions; read by every Trivy step.
  TRIVY_IGNOREFILE: .trivyignore.yaml

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App - lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov --cov-report=term-missing

  require-tags-action:
    name: require-tags action - tests and self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Unit tests
        working-directory: actions/require-tags
        run: |
          pip install pytest==9.1.1 pytest-cov==7.1.0 ruff==0.17.1
          ruff check . && ruff format --check .
          pytest --cov=require_tags --cov-report=term-missing
      # Run the real Docker action, exactly as the deploy pipeline does.
      - name: Action passes a compliant plan
        uses: ./actions/require-tags
        with:
          plan-json: actions/require-tags/tests/fixtures/plan_compliant.json
      - name: Action blocks a plan with missing tags
        id: blocked
        continue-on-error: true
        uses: ./actions/require-tags
        with:
          plan-json: actions/require-tags/tests/fixtures/plan_violations.json
          allowed-values: environment=staging|production
      - name: Assert the bad plan was blocked
        env:
          OUTCOME: ${{ steps.blocked.outcome }}
          VIOLATIONS: ${{ steps.blocked.outputs.violations }}
        run: |
          echo "outcome=$OUTCOME violations=$VIOLATIONS"
          test "$OUTCOME" = "failure"
          test "$VIOLATIONS" -gt 0

  security:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Filesystem scan - vulnerabilities, secrets, IaC misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Build app image
        run: docker build --pull --build-arg "GIT_SHA=$GITHUB_SHA" -t sample-api:pr app
      - name: Image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sample-api:pr
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  terraform-static:
    name: Terraform - fmt and validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [infra/bootstrap, infra/modules/container-app, infra/service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
        working-directory: ${{ matrix.dir }}
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: ${{ matrix.dir }}

  plan:
    name: Terraform plan + tag gate (${{ matrix.environment }})
    needs: terraform-static
    # Needs bootstrap to have run, and OIDC tokens are not issued to fork PRs.
    if: >-
      vars.AZURE_PLAN_CLIENT_ID != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read service name
        id: svc
        run: echo "name=$(yq -r '.service.name' golden-path.yaml)" >> "$GITHUB_OUTPUT"
      - name: Plan (read-only identity, no state lock) and tag gate
        id: plan
        uses: ./.github/actions/terraform-deploy
        with:
          environment: ${{ matrix.environment }}
          # The PR image is not pushed; a placeholder tag is enough for planning.
          image: ${{ vars.ACR_LOGIN_SERVER }}/${{ steps.svc.outputs.name }}:pr-${{ github.event.pull_request.number || 'manual' }}
          registry-server: ${{ vars.ACR_LOGIN_SERVER }}
          git-sha: ${{ github.sha }}
          client-id: ${{ vars.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tfstate-resource-group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          tfstate-storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          tfstate-container: ${{ vars.TFSTATE_CONTAINER }}
          service-name: ${{ steps.svc.outputs.name }}
          apply: "false"
          lock: "false"
      - name: Comment plan on the pull request
        if: always() && github.event_name == 'pull_request' && steps.svc.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            const marker = `<!-- golden-path-plan-${env} -->`;
            let plan = 'Plan output not available.';
            try { plan = fs.readFileSync('infra/service/tfplan.txt', 'utf8'); } catch (e) {}
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';
            const ok = process.env.PLAN_OUTCOME === 'success';
            const body = [
              marker,
              `### Terraform plan: \`${env}\` ${ok ? '✅' : '❌'}`,
              ok ? 'Plan succeeded and every resource carries the required tags.'
                 : 'Plan or required-tags gate failed. See the job summary for the exact resources and tags.',
              '<details><summary>Show plan</summary>', '', '```', plan, '```', '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
